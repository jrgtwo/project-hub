<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>metronomnom — metronome & note variations (v2)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #14110f; color: hsl(38 30% 90%); font-family: Inter, system-ui, sans-serif; min-height: 100vh; padding-bottom: 3rem; }
  header { padding: 1.4rem 1.6rem 0.4rem; }
  h1 { font-family: Fredoka, sans-serif; font-size: 1.3rem; font-weight: 700; }
  p.sub { color: hsl(30 10% 62%); font-size: 0.84rem; margin-top: 0.35rem; max-width: 74ch; line-height: 1.5; }
  .group { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 0.95rem; color: hsl(38 70% 56%); padding: 1rem 1.6rem 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; padding: 0.6rem 1.6rem; }
  @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #1c1813; border: 1px solid #2c2620; border-radius: 16px; overflow: hidden; }
  .name { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 1rem; padding: 0.8rem 1rem 0.1rem; }
  .vibe { font-size: 0.78rem; color: hsl(30 10% 60%); padding: 0.25rem 1rem 0.7rem; line-height: 1.4; min-height: 3em; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; }
  .pane { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 1.1rem 0.5rem; }
  .pane.light { background: hsl(38 34% 85%); }
  .pane.dark { background: hsl(26 16% 13%); }
  .pane .big { width: 98px; height: 98px; }
  .markrow { display: flex; align-items: center; gap: 0.5rem; }
  .markrow .mk { width: 30px; height: 30px; }
  .markrow span { font-family: Fredoka, sans-serif; font-weight: 700; font-size: 0.9rem; }
  .pane.light .markrow span { color: hsl(24 32% 22%); }
  .pane.light .markrow .nom { color: hsl(18 62% 48%); }
  .pane.dark .markrow span { color: hsl(38 30% 90%); }
  .pane.dark .markrow .nom { color: hsl(4 80% 64%); }
</style>
</head>
<body>
  <header>
    <h1>metronomnom — variations, round 2</h1>
    <p class="sub">Fixes applied: pizza crust now joins the slice; the rounded metronome no longer "smokes" (open mouth, note going in); quarter-note head is rounder with the stem moved to the left so it doesn't fight the rightward eating.</p>
  </header>
  <div id="root"></div>

<script>
  var INK = 'hsl(24 30% 18%)';
  var AMBER = 'hsl(40 86% 58%)';
  var AMBER_D = 'hsl(38 62% 46%)';
  var BEAT = 'hsl(4 80% 62%)';
  var MID = 'hsl(30 12% 52%)';
  var MOUTH = 'hsl(20 40% 14%)';
  var CHEESE = 'hsl(44 90% 60%)';
  var CRUST = 'hsl(28 52% 42%)';

  function note(x, y, s, color) {
    return `<g>
      <ellipse cx="${x}" cy="${y}" rx="${5.4 * s}" ry="${4.3 * s}" transform="rotate(-18 ${x} ${y})" fill="${color}"/>
      <rect x="${x + 3.7 * s}" y="${y - 15 * s}" width="${2 * s}" height="${13 * s}" rx="1" fill="${color}"/>
    </g>`;
  }
  function staff() {
    return [40, 50, 60, 70].map(function (y) {
      return `<line x1="40" y1="${y}" x2="99" y2="${y}" stroke="${MID}" stroke-width="1.4"/>`;
    }).join('');
  }

  var groups = [
    {
      title: 'Metronome munchers',
      items: [
        {
          name: 'Classic',
          vibe: 'Cuter pass — rounder body, friendlier eyes, blush cheeks. Pendulum + scale tick keep it a metronome; nibbling a note.',
          svg: `
            <rect x="24" y="84" width="52" height="9" rx="4.5" fill="${AMBER_D}"/>
            <path d="M30 86 L39 33 Q40 28 45 28 L55 28 Q60 28 61 33 L70 86 Z" fill="${AMBER}"/>
            <line x1="50" y1="80" x2="61" y2="16" stroke="${AMBER_D}" stroke-width="3" stroke-linecap="round"/>
            <rect x="56" y="42" width="9" height="8" rx="2" transform="rotate(13 60 46)" fill="${BEAT}"/>
            <line x1="45" y1="38" x2="53" y2="38" stroke="${AMBER_D}" stroke-width="1.4" opacity="0.6"/>
            <circle cx="44" cy="58" r="5" fill="#fff"/><circle cx="45.2" cy="59" r="2.5" fill="${INK}"/>
            <circle cx="56" cy="58" r="5" fill="#fff"/><circle cx="57.2" cy="59" r="2.5" fill="${INK}"/>
            <path d="M42 69 Q50 80 58 69 Q50 74 42 69 Z" fill="${MOUTH}"/>
            ${note(50, 74, 0.58, BEAT)}
            <circle cx="40" cy="66" r="3" fill="${BEAT}" opacity="0.4"/>
            <circle cx="60" cy="66" r="3" fill="${BEAT}" opacity="0.4"/>`,
        },
        {
          name: 'Pizza Slice',
          vibe: 'Crust now joins the slice cleanly. Pepperoni + a pepperoni pendulum bob; snacking on a note.',
          svg: `
            <path d="M50 16 L25 82 L75 82 Z" fill="${CHEESE}"/>
            <path d="M23 81 L77 81 Q50 98 23 81 Z" fill="${CRUST}"/>
            <circle cx="40" cy="48" r="5" fill="${BEAT}"/>
            <circle cx="62" cy="54" r="4.6" fill="${BEAT}"/>
            <line x1="50" y1="78" x2="61" y2="20" stroke="${CRUST}" stroke-width="2.6" stroke-linecap="round"/>
            <circle cx="58" cy="38" r="4.6" fill="${BEAT}"/>
            <circle cx="43" cy="65" r="4.3" fill="#fff"/><circle cx="44" cy="66" r="2.1" fill="${INK}"/>
            <circle cx="57" cy="65" r="4.3" fill="#fff"/><circle cx="58" cy="66" r="2.1" fill="${INK}"/>
            <path d="M44 72 Q50 80 56 72 Q50 76 44 72 Z" fill="${MOUTH}"/>
            ${note(50, 76, 0.5, BEAT)}`,
        },
        {
          name: 'Rounded',
          vibe: 'No more cigar — open round mouth with a note dropping in, eyes open and happy.',
          svg: `
            <rect x="26" y="84" width="48" height="9" rx="4.5" fill="${AMBER_D}"/>
            <path d="M32 86 L38 38 Q40 28 50 28 Q60 28 62 38 L68 86 Z" fill="${AMBER}"/>
            <line x1="50" y1="80" x2="40" y2="16" stroke="${AMBER_D}" stroke-width="3" stroke-linecap="round"/>
            <circle cx="44" cy="40" r="5" fill="${BEAT}"/>
            <circle cx="44" cy="58" r="5" fill="#fff"/><circle cx="45" cy="59" r="2.5" fill="${INK}"/>
            <circle cx="56" cy="58" r="5" fill="#fff"/><circle cx="57" cy="59" r="2.5" fill="${INK}"/>
            <ellipse cx="50" cy="71" rx="8" ry="7.5" fill="${MOUTH}"/>
            ${note(50, 66, 0.5, BEAT)}
            <circle cx="38" cy="66" r="3" fill="${BEAT}" opacity="0.4"/>
            <circle cx="62" cy="66" r="3" fill="${BEAT}" opacity="0.4"/>`,
        },
      ],
    },
    {
      title: 'Quarter-note munchers — rounder head, stem on the left',
      items: [
        {
          name: 'Staff Muncher',
          vibe: 'Round head + left stem = a quarter note, mouth open toward the staff it’s slurping notes off.',
          svg: `
            ${staff()}
            ${note(90, 55, 0.8, BEAT)} ${note(74, 60, 0.8, BEAT)}
            <rect x="13" y="20" width="5" height="42" rx="2.5" fill="${AMBER}"/>
            <circle cx="34" cy="56" r="22" fill="${AMBER}"/>
            <path d="M34 56 L55 47 A22 22 0 0 1 55 65 Z" fill="${MOUTH}"/>
            <path d="M48 60 q5 3 8 -1" stroke="${BEAT}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <circle cx="27" cy="50" r="5.2" fill="#fff"/><circle cx="29" cy="51" r="2.6" fill="${INK}"/>
            <circle cx="40" cy="48" r="5.2" fill="#fff"/><circle cx="42" cy="49" r="2.6" fill="${INK}"/>
            <circle cx="24" cy="62" r="3.2" fill="${BEAT}" opacity="0.4"/>`,
        },
        {
          name: 'Solo Biter',
          vibe: 'Same quarter note on its own, chomping a single beat — cleanest for the small header mark.',
          svg: `
            <rect x="20" y="12" width="5" height="44" rx="2.5" fill="${AMBER}"/>
            <circle cx="48" cy="56" r="25" fill="${AMBER}"/>
            <path d="M48 56 Q60 75 72 60 Q60 66 48 61 Z" fill="${MOUTH}"/>
            <circle cx="80" cy="62" r="5" fill="${BEAT}"/>
            <circle cx="40" cy="50" r="5.6" fill="#fff"/><circle cx="42" cy="51" r="2.8" fill="${INK}"/>
            <circle cx="54" cy="48" r="5.6" fill="#fff"/><circle cx="56" cy="49" r="2.8" fill="${INK}"/>
            <circle cx="36" cy="62" r="3.2" fill="${BEAT}" opacity="0.4"/>`,
        },
        {
          name: 'Beamed Pair',
          vibe: 'Bonus: two beamed eighth-notes ("♫" = nom-nom) sharing one chewing face.',
          svg: `
            <rect x="33" y="22" width="4.5" height="34" rx="2" fill="${AMBER}"/>
            <rect x="69" y="22" width="4.5" height="34" rx="2" fill="${AMBER}"/>
            <path d="M33 22 L74 22 L74 30 L33 30 Z" fill="${AMBER}"/>
            <circle cx="29" cy="58" r="16" fill="${AMBER}"/>
            <circle cx="71" cy="58" r="16" fill="${AMBER}"/>
            <circle cx="25" cy="55" r="3.2" fill="${INK}"/><circle cx="33" cy="55" r="3.2" fill="${INK}"/>
            <circle cx="67" cy="55" r="3.2" fill="${INK}"/><circle cx="75" cy="55" r="3.2" fill="${INK}"/>
            <path d="M24 62 q5 5 10 0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <path d="M66 62 q5 5 10 0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            ${note(50, 50, 0.7, BEAT)}`,
        },
      ],
    },
  ];

  function svgEl(inner, cls) {
    return `<svg class="${cls}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  }
  function pane(kind, inner) {
    return `<div class="pane ${kind}">${svgEl(inner, 'big')}
      <div class="markrow">${svgEl(inner, 'mk')}<span>metro<span class="nom">nomnom</span></span></div></div>`;
  }
  document.getElementById('root').innerHTML = groups.map(function (g) {
    var cards = g.items.map(function (c) {
      return `<div class="card"><div class="name">${c.name}</div><div class="vibe">${c.vibe}</div>
        <div class="stage">${pane('light', c.svg)}${pane('dark', c.svg)}</div></div>`;
    }).join('');
    return `<div class="group">${g.title}</div><div class="grid">${cards}</div>`;
  }).join('');
</script>
</body>
</html>
