<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>metronomnom — Direction 1: Pro Instrument</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ---- Direction 1: PRO INSTRUMENT (restrained) ----
     Pixel-honest to the real app tokens. The only "nom" wink: the repeated
     o's of the wordmark rendered as small amber beat-dots. No mascot. */
  :root {
    --charcoal-deep: 24 8% 8%;
    --charcoal: 24 7% 11%;
    --charcoal-raised: 24 8% 14%;
    --pearl: 32 25% 92%;
    --nickel: 30 10% 78%;
    --amber: 36 92% 58%;        /* degree-root */
    --rosewood: 18 32% 22%;
    --secondary: 24 7% 18%;
    --muted-foreground: 30 10% 64%;
    --radius: 0.625rem;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: hsl(var(--charcoal-deep));
    color: hsl(var(--pearl));
    font-family: Inter, system-ui, sans-serif;
    display: flex; justify-content: center;
    min-height: 100%;
  }
  .app {
    width: 100%; max-width: 32rem;
    min-height: 100vh;
    display: flex; flex-direction: column;
    padding: 1.5rem 1.25rem;
  }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; }
  .wordmark {
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    color: hsl(var(--pearl));
    display: inline-flex; align-items: baseline; gap: 0.02em;
  }
  /* the o's become tiny amber beat-dots */
  .wordmark .o {
    display: inline-block;
    width: 0.46em; height: 0.46em;
    border-radius: 999px;
    background: hsl(var(--amber));
    transform: translateY(-0.02em);
    margin: 0 0.01em;
  }
  .wordmark .dim { color: hsl(var(--muted-foreground)); }
  .calibrate {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: hsl(var(--secondary));
    color: hsl(var(--muted-foreground));
    border: none; border-radius: 999px;
    padding: 0.4rem 0.8rem;
    font-size: 0.72rem; cursor: pointer;
  }
  .calibrate svg { width: 0.85rem; height: 0.85rem; }

  /* Main */
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; padding: 2rem 0; }
  .arc { position: relative; width: 100%; max-width: 380px; }
  .pill { position: absolute; border-radius: 999px; }
  .readout { position: absolute; display: flex; flex-direction: column; align-items: center; }
  .bpm { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 4rem; line-height: 1; letter-spacing: -0.02em; }
  .bpm-label { font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: hsl(var(--muted-foreground)); margin-top: 0.4rem; }

  .bpmctl { display: flex; align-items: center; gap: 1rem; width: 100%; max-width: 320px; }
  .round-sm { width: 2.4rem; height: 2.4rem; border-radius: 999px; border: 1px solid hsl(var(--secondary)); background: hsl(var(--charcoal-raised)); color: hsl(var(--pearl)); font-size: 1.2rem; cursor: pointer; }
  .track { flex: 1; height: 4px; border-radius: 999px; background: hsl(var(--secondary)); position: relative; }
  .track::after { content: ""; position: absolute; left: 0; top: 0; height: 100%; width: 46%; border-radius: 999px; background: hsl(var(--amber)); }
  .track .knob { position: absolute; left: 46%; top: 50%; width: 14px; height: 14px; border-radius: 999px; background: hsl(var(--pearl)); transform: translate(-50%, -50%); }

  .transport { width: 5rem; height: 5rem; border-radius: 999px; border: none; cursor: pointer;
    background: hsl(var(--amber)); color: hsl(24 30% 10%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px -8px hsl(var(--amber) / 0.6); }
  .transport svg { width: 1.8rem; height: 1.8rem; }

  /* Footer */
  footer { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; padding-top: 1rem; }
  .seg { display: inline-flex; background: hsl(var(--charcoal-raised)); border-radius: 999px; padding: 0.25rem; gap: 0.15rem; }
  .seg button { border: none; background: transparent; color: hsl(var(--muted-foreground)); font-size: 0.8rem; padding: 0.35rem 0.8rem; border-radius: 999px; cursor: pointer; font-family: "JetBrains Mono", monospace; }
  .seg button.on { background: hsl(var(--secondary)); color: hsl(var(--pearl)); }
  .row { display: flex; align-items: center; gap: 0.8rem; }
  .label { font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: hsl(var(--muted-foreground)); }
  .vol { width: 140px; height: 4px; border-radius: 999px; background: hsl(var(--secondary)); position: relative; }
  .vol::after { content: ""; position: absolute; left: 0; top: 0; height: 100%; width: 70%; border-radius: 999px; background: hsl(var(--nickel)); }
  .ad { margin-top: 0.5rem; width: 100%; max-width: 24rem; border: 1px dashed hsl(var(--secondary)); border-radius: var(--radius); padding: 0.9rem; text-align: center; color: hsl(var(--muted-foreground)); font-size: 0.7rem; letter-spacing: 0.1em; }
  .tag { position: fixed; left: 12px; bottom: 10px; font-family: "JetBrains Mono", monospace; font-size: 0.65rem; color: hsl(var(--muted-foreground)); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <span class="wordmark">metr<span class="o"></span>n<span class="o"></span>mn<span class="o"></span>m</span>
      <button class="calibrate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        Calibrate
      </button>
    </header>

    <main>
      <div class="arc" id="arc">
        <div class="readout" id="readout">
          <div class="bpm">120</div>
          <div class="bpm-label">BPM · 4/4</div>
        </div>
      </div>

      <div class="bpmctl">
        <button class="round-sm">−</button>
        <div class="track"><div class="knob"></div></div>
        <button class="round-sm">+</button>
      </div>

      <button class="transport"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    </main>

    <footer>
      <div class="seg"><button>2/4</button><button>3/4</button><button class="on">4/4</button><button>6/8</button></div>
      <div class="row">
        <span class="label">Feel</span>
        <div class="seg"><button class="on">♩</button><button>♪♪</button><button>3</button><button>16</button></div>
        <span class="label">Swing</span>
        <div class="vol"></div>
      </div>
      <div class="row">
        <span class="label">Vol</span>
        <div class="vol"></div>
      </div>
      <div class="ad">HOUSE AD · removed with “remove ads”</div>
    </footer>
  </div>
  <div class="tag">Direction 1 — Pro Instrument</div>

<script>
  // Faithful re-implementation of BeatDots geometry (src/components/BeatDots.tsx)
  (function () {
    var MAIN_LEN = 40, MAIN_LEN_ACCENT = 56, MAIN_W = 16, SUB_LEN = 18, SUB_W = 6;
    var MARGIN = 8, SPACING = 22, MAX_SPAN = (265 * Math.PI) / 180, R_MIN = 64, R_MAX = 150;
    var beats = 4, accents = [0], subsPerBeat = 2, currentBeat = 0, currentSub = 0, running = true;

    var arc = document.getElementById('arc');
    var width = Math.min(380, arc.clientWidth || 380);

    var items = [];
    for (var b = 0; b < beats; b++) {
      items.push({ sub: false, accent: accents.indexOf(b) >= 0, on: running && currentBeat === b });
      for (var s = 1; s < subsPerBeat; s++) items.push({ sub: true, accent: false, on: running && currentBeat === b && currentSub === s });
    }
    var n = items.length;
    var R = Math.max(R_MIN, Math.min(R_MAX, width / 2 - MAIN_LEN_ACCENT - MARGIN));
    var cx = width / 2, cy = MARGIN + R + MAIN_LEN_ACCENT;
    var step = n > 1 ? SPACING / R : 0;
    if ((n - 1) * step > MAX_SPAN) step = MAX_SPAN / (n - 1);
    var k = n > 1 ? Math.max(0.4, Math.min(1, (step * R) / SPACING)) : 1;
    var span = (n - 1) * step, start = -Math.PI / 2 - span / 2;
    var height = cy + 64;
    arc.style.height = height + 'px';

    var AMBER = 'hsl(36 92% 58%)', PEARL = 'hsl(32 25% 92%)';
    items.forEach(function (it, i) {
      var a = start + i * step;
      var len = (it.sub ? SUB_LEN : it.accent ? MAIN_LEN_ACCENT : MAIN_LEN) * k;
      var w = (it.sub ? SUB_W : MAIN_W) * k;
      var rad = R + len / 2;
      var x = cx + rad * Math.cos(a), y = cy + rad * Math.sin(a);
      var rot = (a * 180) / Math.PI + 90;
      var el = document.createElement('div');
      el.className = 'pill';
      el.style.width = w + 'px'; el.style.height = len + 'px';
      el.style.left = x + 'px'; el.style.top = y + 'px';
      el.style.transform = 'translate(-50%,-50%) rotate(' + rot + 'deg)';
      if (it.sub) { el.style.background = it.on ? PEARL : 'hsl(32 25% 92% / 0.15)'; }
      else if (it.on) {
        if (it.accent) { el.style.background = AMBER; el.style.boxShadow = '0 0 22px -2px ' + AMBER; }
        else { el.style.background = PEARL; el.style.boxShadow = '0 0 18px -4px ' + PEARL; }
      } else { el.style.background = it.accent ? 'hsl(36 92% 58% / 0.25)' : 'hsl(32 25% 92% / 0.15)'; }
      arc.appendChild(el);
    });

    var ro = document.getElementById('readout');
    ro.style.left = cx + 'px'; ro.style.top = cy + 'px';
    ro.style.transform = 'translate(-50%,-50%)';
  })();
</script>
</body>
</html>
